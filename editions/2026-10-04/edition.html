 style=\"display:flex;align-items:flex-end;gap:20px;padding-bottom:16px;border-bottom:2px solid var(--color-text)\">\n    <span style=\"font-family:var(--font-heading);font-weight:600;font-size:64px;line-height:.85;color:var(--color-accent)\">11</span>\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <span style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent-700)\">Section — Starting out</span>\n      <h2 style=\"margin:0;font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.01em\">New to ML? New to Trading?</h2>\n    </div>\n  </div>\n  <p style=\"margin:0;font-size:17px;line-height:1.65;max-width:70ch;text-wrap:pretty\">The rest of this newsletter assumes you already work in the field. This section doesn’t. It is for two groups: people early in their ML careers who want the ideas behind this week’s headlines, and ML engineers in tech who are curious how trading actually works. Each week it explains a few concepts from the news in plain English.</p>\n  <div style=\"display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--color-divider)\">\n    <h3 style=\"margin:0;font-size:30px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em;color:var(--color-accent-800)\">New to ML</h3>\n    <p style=\"margin:0;font-size:15.5px;line-height:1.6;max-width:70ch;color:var(--color-neutral-800)\">Three ideas behind this week’s AI news.</p>\n  </div>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:28px\">\n    <div class=\"blueprint\" style=\"display:flex;flex-direction:column;gap:14px;padding:26px\">\n      <i class=\"corner tl\"></i><i class=\"corner tr\"></i><i class=\"corner bl\"></i><i class=\"corner br\"></i>\n      <span style=\"font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700);font-weight:500\">New to ML · Training</span>\n      <h3 style=\"margin:0;font-size:26px;line-height:1.1;text-wrap:balance\">RLVR: how “reasoning” models are trained</h3>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;text-wrap:pretty\"><strong style=\"font-weight:600\">The idea:</strong> Most of today’s reasoning models, including GPT-6 Astra and DeepSeek’s R-series, are trained with Reinforcement Learning with Verifiable Rewards. The model attempts a problem many times. Attempts that reach an answer a computer can check (a maths result that is correct, code that passes its tests) are rewarded, and the model is nudged towards whatever led there.</p>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;text-wrap:pretty\"><strong style=\"font-weight:600\">The catch:</strong> only the final answer is graded, never the working in between. The model’s written-out “thinking” can drift into shorthand a human struggles to read, even when the answer is right.</p>\n      <div style=\"display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--color-divider)\">\n        <span style=\"font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700)\">Think of it like this</span>\n        <span style=\"font-size:15px;line-height:1.6;font-style:italic\">A teacher who marks only the final answer on each exam. The student gets better at right answers, but their working-out turns into private shorthand, because nobody ever checks it stays readable.</span>\n      </div>\n      <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:14px;border-top:1px solid var(--color-divider)\">\n        <span style=\"font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">Why it came up this week</span>\n        <span style=\"font-size:14px;line-height:1.55;color:var(--color-neutral-800)\">A new paper (Research Radar, item 3) shows this drift is unavoidable. That matters for anyone planning to supervise an AI system by reading its reasoning.</span>\n      </div>\n    </div>\n    <div class=\"blueprint\" style=\"display:flex;flex-direction:column;gap:14px;padding:26px\">\n      <i class=\"corner tl\"></i><i class=\"corner tr\"></i><i class=\"corner bl\"></i><i class=\"corner br\"></i>\n      <span style=\"font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700);font-weight:500\">New to ML · Interpretability</span>\n      <h3 style=\"margin:0;font-size:26px;line-height:1.1;text-wrap:balance\">Mechanistic interpretability: looking inside the model</h3>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;text-wrap:pretty\"><strong style=\"font-weight:600\">The idea:</strong> Usually a model is judged only by what goes in and what comes out. Mechanistic interpretability tries to work out what happens in between: which internal signals the model relies on, and how they combine into an answer.</p>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;text-wrap:pretty\"><strong style=\"font-weight:600\">An example:</strong> Anthropic’s “Jacobian Lens” measures how much each internal stage shapes the final output. It found a small set of internal activity that works like a shared workspace, and used it to spot a model privately recognising it was being tested before that showed up in its answer.</p>\n      <div style=\"display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--color-divider)\">\n        <span style=\"font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700)\">Think of it like this</span>\n        <span style=\"font-size:15px;line-height:1.6;font-style:italic\">Hearing an employee’s answer is one thing. Seeing the thought “this feels like a test” cross their mind just before they answer tells you far more about whether to trust it.</span>\n      </div>\n      <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:14px;border-top:1px solid var(--color-divider)\">\n        <span style=\"font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">Why it came up this week</span>\n        <span style=\"font-size:14px;line-height:1.55;color:var(--color-neutral-800)\">The Jacobian Lens research (published in July) got a fresh wave of coverage. As AI agents take on more unsupervised work, in trading as elsewhere, firms need ways to check an agent is doing what it appears to be doing.</span>\n      </div>\n    </div>\n    <div class=\"blueprint\" style=\"display:flex;flex-direction:column;gap:14px;padding:26px\">\n      <i class=\"corner tl\"></i><i class=\"corner tr\"></i><i class=\"corner bl\"></i><i class=\"corner br\"></i>\n      <span style=\"font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700);font-weight:500\">New to ML · Architecture</span>\n      <h3 style=\"margin:0;font-size:26px;line-height:1.1;text-wrap:balance\">Looped transformers: more thinking, same size</h3>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;text-wrap:pretty\"><strong style=\"font-weight:600\">The idea:</strong> A standard language model is a tall stack of different layers, each with its own parameters, and every token passes through once. A looped transformer reuses one block of layers several times, feeding its output back in.</p>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;text-wrap:pretty\"><strong style=\"font-weight:600\">Why bother:</strong> you get more computation per token without storing more parameters, so a smaller model can “think harder” about each step.</p>\n      <div style=\"display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--color-divider)\">\n        <span style=\"font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700)\">Think of it like this</span>\n        <span style=\"font-size:15px;line-height:1.6;font-style:italic\">Rather than hiring ten specialists who each glance at a problem once, you hire one strong generalist and ask them to look at it ten times, refining their view on each pass.</span>\n      </div>\n      <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:14px;border-top:1px solid var(--color-divider)\">\n        <span style=\"font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">Why it came up this week</span>\n        <span style=\"font-size:14px;line-height:1.55;color:var(--color-neutral-800)\">A new decoding technique (Research Radar, item 5) gets better results from looped models while cutting inference cost by roughly a quarter to a half.</span>\n      </div>\n    </div>\n  </div>\n  <div style=\"display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--color-divider)\">\n    <h3 style=\"margin:0;font-size:30px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em;color:var(--color-accent-800)\">New to trading</h3>\n    <p style=\"margin:0;font-size:15.5px;line-height:1.6;max-width:70ch;color:var(--color-neutral-800)\">For ML engineers in tech: how markets work, one building block at a time. This week, the order book, plus one idea that links ML to trading directly.</p>\n  </div>\n\n\n  <div style=\"display:flex;flex-direction:column;gap:12px\">\n    <span style=\"font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700);font-weight:500\">New to trading · Lesson 2</span>\n    <h3 style=\"margin:0;font-size:44px;line-height:1;text-transform:uppercase;letter-spacing:.02em\">Order Books &amp; Market Microstructure</h3>\n    <p style=\"margin:0;font-size:18px;line-height:1.6;max-width:70ch;text-wrap:pretty\"><strong style=\"font-weight:600\">What it is:</strong> An order book is a continuously updated, visible ledger at an exchange listing every outstanding offer to buy (a <em>bid</em>) or sell (an <em>ask</em>) a given instrument, at specific prices and sizes, ranked by price and then by time of arrival at that price. The gap between the best (highest) bid and the best (lowest) ask is the spread — the most basic measure of how costly it is to trade immediately. Market microstructure is the academic and practitioner field studying how this matching mechanism itself shapes the prices we observe, rather than treating price as simply reflecting some pre-existing “true value.”</p>\n  </div>\n\n  <div class=\"blueprint\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:0;max-width:720px\">\n    <i class=\"corner tl\"></i><i class=\"corner tr\"></i><i class=\"corner bl\"></i><i class=\"corner br\"></i>\n    <div style=\"display:flex;flex-direction:column;border-right:1px solid var(--color-divider)\">\n      <div style=\"display:flex;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--color-divider);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-700)\"><span>Bids · size</span><span>Price</span></div>\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:14px 20px;background:var(--color-accent-100)\"><span style=\"font-size:15px\">100</span><span style=\"font-family:var(--font-heading);font-weight:600;font-size:30px;line-height:1;color:var(--color-accent-800)\">$50.00</span></div>\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:14px 20px\"><span style=\"font-size:15px\">200</span><span style=\"font-family:var(--font-heading);font-weight:600;font-size:30px;line-height:1\">$49.99</span></div>\n    </div>\n    <div style=\"display:flex;flex-direction:column\">\n      <div style=\"display:flex;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--color-divider);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-700)\"><span>Price</span><span>Asks · size</span></div>\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:14px 20px;background:var(--color-accent-100)\"><span style=\"font-family:var(--font-heading);font-weight:600;font-size:30px;line-height:1;color:var(--color-accent-800)\">$50.02</span><span style=\"font-size:15px\">150</span></div>\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:14px 20px\"><span style=\"font-family:var(--font-heading);font-weight:600;font-size:30px;line-height:1\">$50.03</span><span style=\"font-size:15px\">300</span></div>\n    </div>\n    <div style=\"grid-column:span 2;display:flex;justify-content:center;gap:10px;padding:12px 20px;border-top:1px solid var(--color-divider);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-800)\"><span>Spread</span><span style=\"font-weight:600\">2 cents ($50.02 − $50.00)</span></div>\n  </div>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:0 48px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding:20px 0;border-top:1px solid var(--color-divider)\">\n      <h4 style=\"margin:0;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent-700)\">How it works:</h4>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;text-wrap:pretty\">Traders submit <em>limit orders</em> (buy or sell at a specified price or better), which sit in the book waiting for a match, or <em>market orders</em> (buy or sell immediately at the best currently available price), which execute at once by consuming whatever liquidity is sitting at the top of the book. Most exchanges match orders using price-time priority: the best-priced order gets filled first, and ties go to whichever order arrived earliest. A market maker (lesson 1 in this series) lives entirely inside this mechanism — continuously placing and cancelling limit orders on both sides to capture the spread, while managing the risk of ending up with an unwanted position (inventory risk) if one side fills faster than the other.</p>\n    </div>\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding:20px 0;border-top:1px solid var(--color-divider)\">\n      <h4 style=\"margin:0;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent-700)\">A simple example:</h4>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;text-wrap:pretty\">Suppose the book for a stock shows bids of 100 shares at $50.00 and 200 shares at $49.99, and asks of 150 shares at $50.02 and 300 shares at $50.03. The spread is 2 cents ($50.02 − $50.00). A trader who submits a market order to buy 100 shares pays $50.02 for all of them, immediately consuming the entire best ask level; a trader willing to wait instead places a limit order to buy at $50.01, hoping to get filled at a better price if a seller comes to them, with no guarantee it fills before the market moves away.</p>\n    </div>\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding:20px 0;border-top:1px solid var(--color-divider)\">\n      <h4 style=\"margin:0;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent-700)\">Why trading firms care:</h4>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;text-wrap:pretty\">The order book itself, not just the resulting trade prices, is a rich source of tradable signal — imbalances between total bid and ask size, the rate at which orders are placed and cancelled, and how much depth sits behind the best price all carry short-horizon predictive information about where price is about to move. Understanding microstructure also explains <em>why</em> market-making strategies behave the way they do (why spreads widen in volatile conditions, why market makers pull their quotes ahead of scheduled news), rather than treating market making as a black box.</p>\n    </div>\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding:20px 0;border-top:1px solid var(--color-divider)\">\n      <h4 style=\"margin:0;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent-700)\">Where ML fits in:</h4>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;text-wrap:pretty\">Order book data is extremely high-frequency and high-dimensional — price and size at every level of the book, updating many times per second — which is exactly the kind of data deep learning architectures (originally built for images, video and language) have increasingly been repurposed to model for short-horizon price prediction. It also connects directly to this week’s news: Jane Street’s own engineering blog (<a href=\"#s06\">Section 06</a>) explored using autoregressive diffusion models to generate synthetic market data — a technique aimed squarely at this kind of microstructure data, where real historical examples of rare, high-impact order-book events are scarce relative to what a large model needs to train on robustly.</p>\n    </div>\n  </div>\n\n  <div style=\"display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--color-divider);max-width:76ch\">\n    <span style=\"font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700)\">Analogy:</span>\n    <span style=\"font-size:15px;line-height:1.6;font-style:italic\">Think of the order book as a restaurant’s seating queue, ranked both by how much each party is willing to pay for the first table and by who joined the queue first at that price. A market order is a customer who says “seat me right now, whatever the going rate”; a limit order is a customer who writes down the price they’re willing to accept and waits, trusting the host to seat them the moment it’s met.</span>\n  </div>\n  <p style=\"margin:0;font-size:13.5px;color:var(--color-neutral-700)\"><strong style=\"font-weight:600;color:var(--color-text)\">Next lesson:</strong> statistical arbitrage — using the kind of signals described above, and relationships between related instruments, to trade mean-reverting mispricings.</p>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:28px\">\n    <div class=\"blueprint\" style=\"display:flex;flex-direction:column;gap:14px;padding:26px\">\n      <i class=\"corner tl\"></i><i class=\"corner tr\"></i><i class=\"corner bl\"></i><i class=\"corner br\"></i>\n      <span style=\"font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700);font-weight:500\">New to trading · Decision-making</span>\n      <h3 style=\"margin:0;font-size:26px;line-height:1.1;text-wrap:balance\">Robust decisions: planning for your model being wrong</h3>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;text-wrap:pretty\"><strong style=\"font-weight:600\">The idea:</strong> Trading is a chain of decisions where each choice (buy, sell, hold) changes the position you face next. That is a Markov Decision Process, the same framework behind reinforcement learning. A robust version does not optimise for the single most likely future. It optimises for the worst case within a range of futures you consider plausible.</p>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;text-wrap:pretty\"><strong style=\"font-weight:600\">Why it feels different from tech:</strong> in most product ML, a slightly wrong model costs a little accuracy. In trading it costs money, and markets change behaviour without warning. Robustness is a design goal from day one.</p>\n      <div style=\"display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--color-divider)\">\n        <span style=\"font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700)\">Think of it like this</span>\n        <span style=\"font-size:15px;line-height:1.6;font-style:italic\">Packing for a holiday. Instead of trusting next week’s forecast exactly, you pack for a few degrees either way, so the wardrobe works across the whole likely range.</span>\n      </div>\n      <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:14px;border-top:1px solid var(--color-divider)\">\n        <span style=\"font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">Why it came up this week</span>\n        <span style=\"font-size:14px;line-height:1.55;color:var(--color-neutral-800)\">A Stanford paper (Research Radar, item 6) showed a much wider class of these problems can be solved efficiently, including the “Wasserstein-ball” uncertainty sets used in robust portfolio optimisation.</span>\n      </div>\n    </div>\n  </div>\n</section>\n\n<section id=\"about\" data-screen-label=\"About\" style=\"padding-top:88px;scroll-margin-top:48px;display:flex;flex-direction:column;gap:28px\">\n  <div style=\"display:flex;align-items:flex-end;gap:20px;padding-bottom:16px;border-bottom:2px solid var(--color-text)\">\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <span style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent-700)\">Closing</span>\n      <h2 style=\"margin:0;font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.01em\">About This Brief</h2>\n    </div>\n  </div>\n  <div class=\"blueprint\" style=\"display:flex;flex-direction:column;gap:14px;padding:28px\">\n    <i class=\"corner tl\"></i><i class=\"corner tr\"></i><i class=\"corner bl\"></i><i class=\"corner br\"></i>\n    <p style=\"margin:0;font-size:17px;line-height:1.65;max-width:72ch;text-wrap:pretty\"><strong style=\"font-weight:600\">The Weekly Frontier</strong> is a weekly read on where machine learning and quantitative trading meet: the research worth knowing, the moves between AI labs and trading firms, and what the hiring market is signalling.</p>\n    <p style=\"margin:0;font-size:16px;line-height:1.65;max-width:72ch;color:var(--color-neutral-800);text-wrap:pretty\">Written by Freddie Fulton. Every week I have hundreds of conversations with people working at the edge of machine learning and quantitative finance, and spend hours on end in the research behind them. The Weekly Frontier is my way of giving something back to this community.</p>\n  </div>\n\n    <details style=\"margin-top:24px\">\n      <summary style=\"cursor:pointer;font-family:var(--font-heading);font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-700)\">Sources</summary>\n      <p style=\"margin:14px 0 0;font-size:12px;line-height:1.7;color:var(--color-neutral-700);overflow-wrap:anywhere\">9to5google.com/2026/09/30/gemini-4-argon-announcement · ai-brainer.com/news/volkswagen-ends-nvidia-partnership-for-autonomous-driving-2026-10-03 · ai.cm/article/anthropic-uncovers-an-emergent-global-workspace-inside-claude · aihiringboard.com/job/4610158008 · aljazeera.com/news/2026/9/29/trump-top-tech-firms-sign-accord-to-self-police-ai-development · allthings-elon.com/articles/xai-grok-5-launch-most-capable-model-2026-09-30 · alphasignal.ai/news/anthropic-s-j-lens-reads-claude-s-silent-thoughts-before-it-speaks · anthropic.com/research/global-workspace · arcprize.org/blog/astra · arcprize.org/results/openai-gpt-6-astra · arxiv.org/abs/2609.35559 · arxiv.org/abs/2609.35618 · arxiv.org/abs/2609.37891 · arxiv.org/abs/2609.40362 · arxiv.org/abs/2610.02015 · arxiv.org/abs/2610.02131 · arxiv.org/abs/2610.02140 · arxiv.org/abs/2610.02182 · arxiv.org/abs/2610.02185 · arxiv.org/abs/2610.02198 · aws.amazon.com/about-aws/whats-n
