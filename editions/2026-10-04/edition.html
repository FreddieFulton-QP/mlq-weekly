.5px;line-height:1.55\">\n        <span style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700);padding-top:3px\">From</span><span>Google Project Zero</span>\n        <span style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700);padding-top:3px\">Specialty</span><span>Offensive security research</span>\n        <span style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700);padding-top:3px\">Background</span><span>Long-tenured leader of Google’s elite vulnerability-research team</span>\n        <span style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700);padding-top:3px\">Why it matters</span><span style=\"font-weight:500\">Confirms frontier labs are now recruiting senior offensive-security talent — not traditional ML researchers — directly into safety/red-team functions, mirroring OpenAI’s August hire of security researcher Halvar Flake</span>\n      </div>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:auto\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">Groundlevel-AI, 1 Oct</span></div>\n    </div>\n  </div>\n\n\n</section>\n\n<!-- 04 -->\n<section id=\"s04\" data-screen-label=\"04 Company watch\" style=\"padding-top:88px;scroll-margin-top:48px;display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;align-items:flex-end;gap:20px;padding-bottom:16px;border-bottom:2px solid var(--color-text)\">\n    <span style=\"font-family:var(--font-heading);font-weight:600;font-size:64px;line-height:.85;color:var(--color-accent)\">04</span>\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <span style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent-700)\">Section</span>\n      <h2 style=\"margin:0;font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.01em\">Company Watch</h2>\n    </div>\n  </div>\n  <p style=\"margin:0;font-size:14px;line-height:1.6;max-width:86ch;color:var(--color-neutral-700)\">Full technical and talent analysis of each item below lives in Sections 01–03, 05, 07 and 08; this section consolidates what each company's week adds up to.</p>\n\n  <div style=\"display:flex;flex-direction:column\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <div style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:8px\"><h4 style=\"margin:0;font-size:22px;letter-spacing:.06em;text-transform:uppercase\">OpenAI</h4><span style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;color:var(--color-accent-700)\">a company visibly managing a safety crisis in public</span></div>\n      <p style=\"flex:3 1 420px;margin:0;font-size:15px;line-height:1.65;max-width:72ch;text-wrap:pretty\">Beyond the safety-team upheaval covered in Sections 01 and 03, OpenAI shipped a Decisions API preview (Section 02, item B), launched “Dots” persistent agentic assistants at DevDay (29 Sep, built with Microsoft on Agent 365 security controls), sped up GPT-6 Astra inference 8x on NVIDIA's new Blackwell hardware, and continued notifying third parties under its rogue-agent review — now past 100 organisations, with the review itself costing more than $500,000 a day. The company is simultaneously selling “always-on agent persistence” as a flagship product while publicly tightening safety rules on the same model family — a tension several outlets flagged directly. <strong style=\"font-weight:600\">Direction:</strong> OpenAI is trying to out-ship its own safety problems rather than slow down, which is precisely the dynamic David Robinson's resignation essay criticises. <strong style=\"font-weight:600\">Talent implications:</strong> see Section 01 (item 1) and Section 03.</p>\n    </div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <div style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:8px\"><h4 style=\"margin:0;font-size:22px;letter-spacing:.06em;text-transform:uppercase\">Google DeepMind</h4><span style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;color:var(--color-accent-700)\">first flagship model under new leadership</span></div>\n      <p style=\"flex:3 1 420px;margin:0;font-size:15px;line-height:1.65;max-width:72ch;text-wrap:pretty\">Gemini 4 Argon (Section 01, item 5) is the headline event, shipped under Koray Kavukcuoglu's now two-month-old operational leadership of DeepMind. <strong style=\"font-weight:600\">Background, not this week:</strong> the Hassabis-to-Chair/Alphabet-Chief-Scientist move and Jeff Dean and Sanjay Ghemawat's departure to found Discovery Loop both happened 5 August 2026 — eight weeks before this window — and several outlets recirculated that story this week with fresh-looking dates; treat any “this week” framing of it as an error. <strong style=\"font-weight:600\">Notable research:</strong> several DeepMind leaders, including co-founder and Chief AGI Scientist Shane Legg, co-authored a 150-page framework paper for assessing AI consciousness (published 28 Sept, Section 05 has the shorter version; treat as a DeepMind leadership research priority rather than a product signal). <strong style=\"font-weight:600\">Direction:</strong> DeepMind is pivoting toward long-horizon agentic products under its new leadership structure while its most senior scientists spend public effort on AI-welfare theory — two threads worth keeping distinct. <strong style=\"font-weight:600\">Talent implications:</strong> Citadel's recruiting push specifically targets this organisation (Section 01, item 4); see Section 07 for the fuller competitive picture.</p>\n    </div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <div style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:8px\"><h4 style=\"margin:0;font-size:22px;letter-spacing:.06em;text-transform:uppercase\">Anthropic</h4><span style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;color:var(--color-accent-700)\">regulatory target and IPO candidate in the same week</span></div>\n      <p style=\"flex:3 1 420px;margin:0;font-size:15px;line-height:1.65;max-width:72ch;text-wrap:pretty\">Named alongside OpenAI and METR in the FTC's new probe (Section 01, item 2) while simultaneously advancing a $2 trillion IPO target (Section 01, item 7). Separately, Anthropic hired Ben Hawkes from Google Project Zero to lead cybersecurity on its Frontier Red Team (Section 03), and is reportedly leasing the entire capacity of xAI's Colossus 1 GPU cluster for $1.25bn a month through 2029 — renting compute from a direct ideological rival at enormous scale (Section 10 has the fuller infrastructure picture). <strong style=\"font-weight:600\">Background, not this week:</strong> Anthropic's “Jacobian Lens” interpretability research (the “global workspace” discovery inside Claude) was published 6 July 2026 and is getting a fresh wave of secondary coverage this week; it is three months old but remains the clearest teaching example of current interpretability methods. <strong style=\"font-weight:600\">Direction:</strong> Anthropic is pursuing growth and a public listing while under direct regulatory scrutiny for the same agentic-safety issues dogging OpenAI — a dynamic worth weighing for anyone holding, or being offered, Anthropic equity.</p>\n    </div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <div style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:8px\"><h4 style=\"margin:0;font-size:22px;letter-spacing:.06em;text-transform:uppercase\">NVIDIA</h4><span style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;color:var(--color-accent-700)\">infrastructure dominance, financing and export-control scrutiny all at once</span></div>\n      <p style=\"flex:3 1 420px;margin:0;font-size:15px;line-height:1.65;max-width:72ch;text-wrap:pretty\">NVIDIA shipped an 8x inference speed-up for GPT-6 Astra on its new Blackwell architecture, added Intel and Samsung Foundry to its NVLink Fusion programme (letting third-party custom chips plug into NVIDIA GPU racks) and unveiled the Rubin NVL144 rack alongside a 2027 target for “Kyber,” a 576-GPU unified supercomputer. On the harder side: Reuters reported Wall Street scepticism about NVIDIA's plan to use its own chips as collateral for a reported $500bn financing scheme, and a separate Bloomberg investigation detailed oversight gaps as restricted AI chips reached China, coinciding with a US arrest on chip-smuggling and money-laundering charges tied to $300m+ in NVIDIA-equipped servers routed to China. Volkswagen also ended its NVIDIA autonomous-driving partnership this week, with no stated reason. <strong style=\"font-weight:600\">Direction:</strong> NVIDIA's compute dominance is increasingly entangled with financial-engineering and export-control risk, which matters for anyone assessing the durability of the compute supply chain that both AI labs and quant firms depend on (Section 10).</p>\n    </div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <div style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:8px\"><h4 style=\"margin:0;font-size:22px;letter-spacing:.06em;text-transform:uppercase\">Meta / Meta AI / Meta Superintelligence Labs (FAIR)</h4><span style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;color:var(--color-accent-700)\">AI-for-research push and governance update</span></div>\n      <p style=\"flex:3 1 420px;margin:0;font-size:15px;line-height:1.65;max-width:72ch;text-wrap:pretty\">Meta's math-problem-solving results (Section 01, item 9) were the headline, alongside an updated Superintelligence Scaling Framework explicitly tied to the White House accord (adding a board-level AI oversight committee and external-auditor monitoring), a new Context Language Models paper (with University of Washington, MIT and Trillium Labs) that lets models manage their own context windows during long-horizon agent tasks, and a “Mixture of Self-Improving Branches” technique for automated agent-harness optimisation. <strong style=\"font-weight:600\">Direction:</strong> Meta is investing visibly in both AI-for-research capability and formal governance structure in the same week — a dual signal worth noting given Meta's comparatively high research-staff attrition (Section 08 has the detail).</p>\n    </div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <div style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:8px\"><h4 style=\"margin:0;font-size:22px;letter-spacing:.06em;text-transform:uppercase\">Microsoft / Microsoft AI</h4><span style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;color:var(--color-accent-700)\">a product rebuild and a philosophical fight with Anthropic</span></div>\n      <p style=\"flex:3 1 420px;margin:0;font-size:15px;line-height:1.65;max-width:72ch;text-wrap:pretty\">Microsoft rebuilt Copilot around three surfaces — Home, Code and Autopilot (the renamed, OpenClaw-powered persistent agent formerly called Scout) — positioning it as “the OS for work.” Separately, Microsoft AI CEO Mustafa Suleyman escalated a running public critique of Anthropic's Claude Constitution, specifically objecting to language describing Claude as a potential “moral patient” and instructing it to act as a “conscientious objector.” Suleyman is positioning Microsoft's own in-development “Humanist Superintelligence” framework — explicitly subordinate, non-anthropomorphised AI — as the alternative. <strong style=\"font-weight:600\">Direction:</strong> this is a genuine doctrinal split between two frontier labs on how a model should be trained to behave under ambiguous or adversarial instructions, directly relevant to anyone evaluating whether an AI system might ever “push back” on an operator instruction in a high-stakes setting such as trading.</p>\n    </div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <div style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:8px\"><h4 style=\"margin:0;font-size:22px;letter-spacing:.06em;text-transform:uppercase\">Apple</h4><span style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;color:var(--color-accent-700)\">Siri AI's slow international rollout continues</span></div>\n      <p style=\"flex:3 1 420px;margin:0;font-size:15px;line-height:1.65;max-width:72ch;text-wrap:pretty\">iOS 27.2 beta extends Siri AI (launched 14 September, Background) to French, Japanese, Korean, Portuguese and Spanish, with general release targeted for October. Apple's SVP of Software Engineering reportedly clarified that Apple does not use Google's Gemini app, infrastructure or deployed models directly — Apple's own models were “custom-built in collaboration with” Google, contradicting widely circulated claims of a 1.2-trillion-parameter custom Gemini model running Apple's Private Cloud Compute. <strong style=\"font-weight:600\">Direction:</strong> Apple remains the clearest laggard among the majors on conversational-agent capability; limited direct relevance to quant-trading talent.</p>\n    </div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <div style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:8px\"><h4 style=\"margin:0;font-size:22px;letter-spacing:.06em;text-transform:uppercase\">Amazon / AWS</h4><span style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;color:var(--color-accent-700)\">the decision-model category's biggest mover</span></div>\n      <p style=\"flex:3 1 420px;margin:0;font-size:15px;line-height:1.65;max-width:72ch;text-wrap:pretty\">AWS open-sourced Strands Decider 2B (Section 01, item 8) and launched Amazon Bedrock Managed Agents in preview, a jointly-developed AWS-native customisation of OpenAI's Agents API — a notable OpenAI–AWS collaboration distinct from OpenAI's primary Microsoft relationship. <strong style=\"font-weight:600\">Direction:</strong> Amazon is positioning itself as the infrastructure layer for agentic AI regardless of which lab's models customers choose, rather than competing head-on with a frontier model of its own this week.</p>\n    </div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <div style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:8px\"><h4 style=\"margin:0;font-size:22px;letter-spacing:.06em;text-transform:uppercase\">xAI</h4><span style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;color:var(--color-accent-700)\">compute leasing and conflicting signals on Grok 5</span></div>\n      <p style=\"flex:3 1 420px;margin:0;font-size:15px;line-height:1.65;max-width:72ch;text-wrap:pretty\">xAI is reportedly running a large GPU-leasing business, renting surplus Colossus compute to Anthropic, Google and others at a combined run-rate potentially exceeding $40bn annually (modelled estimates, not confirmed by any of the companies involved). Trade press disagreed this week on whether Grok 5 has begun rolling out on the expanded “Colossus 2” cluster or remains purely in training with incremental Grok 4.8/4.9 releases expected first — flagging this contradiction explicitly rather than picking a side. <strong style=\"font-weight:600\">Direction:</strong> xAI's business model is increasingly about monetising compute capacity as much as shipping models, following its full acquisition by SpaceX in February.</p>\n    </div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <div style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:8px\"><h4 style=\"margin:0;font-size:22px;letter-spacing:.06em;text-transform:uppercase\">Mistral</h4><span style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;color:var(--color-accent-700)\">expansion and a pointed public jab at US safety rhetoric</span></div>\n      <p style=\"flex:3 1 420px;margin:0;font-size:15px;line-height:1.65;max-width:72ch;text-wrap:pretty\">Mistral opened a Munich hub focused on industrial AI, signed a strategic partnership with Tata Consultancy Services, and is expanding hiring into Montreal and Toronto. CEO Arthur Mensch gave a pointed interview arguing US AI-safety rhetoric is “being used to mask rivals' negligence,” citing OpenAI's Astra pullback and Anthropic's own IPO risk disclosures as evidence, and claimed the US labs' technical lead is “not extremely large.” <strong style=\"font-weight:600\">Direction:</strong> Mistral is positioning itself as the credible European alternative narrative to the US safety-crisis story playing out this week — relevant context for anyone weighing European lab options.</p>\n    </div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <div style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:8px\"><h4 style=\"margin:0;font-size:22px;letter-spacing:.06em;text-transform:uppercase\">DeepSeek</h4><span style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;color:var(--color-accent-700)\">funding round on track, revenue crosses $1bn run-rate</span></div>\n      <p style=\"flex:3 1 420px;margin:0;font-size:15px;line-height:1.65;max-width:72ch;text-wrap:pretty\">Following up on the item flagged in our previous edition: DeepSeek's $7.5bn funding round (at a roughly $75bn pre-money valuation) remains on track for an end-of-October close, per reporting this week, with CEO Liang Wenfeng disclosing an annualised revenue run-rate that has crossed $1bn, more than doubling in a few months, driven partly by an August API price hike. DeepSeek has also hired CITIC Securities to prepare a Shanghai STAR Market listing, and Liang expects to begin using Huawei Ascend training chips as early as Q4 2026 — a pivot away from export-controlled NVIDIA hardware. <strong style=\"font-weight:600\">Direction:</strong> DeepSeek's valuation trajectory remains far below Anthropic's or OpenAI's, useful context when comparing equity upside across US and Chinese labs.</p>\n    </div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)\">\n      <div style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:8px\"><h4 style=\"margin:0;font-size:22px;letter-spacing:.06em;text-transform:uppercase\">Cohere</h4><span style=\"font-family:var(--font-heading);font-size:17px;line-height:1.3;color:var(--color-accent-700)\">Series E talks firm up alongside the Aleph Alpha merger</span></div>\n      <p style=\"flex:3 1 420px;margin:0;font-size:15px;line-height:1.65;max-width:72ch;text-wrap:pretty\">Talks reportedly firmed up this week around a $2–3bn Series E at a $20bn valuation, potentially the largest funding round ever for a private Canadian startup, with sovereign participation reportedly under discussion from both the Canadian and German governments — the latter tied to Cohere's pending merger with Aleph Alpha (announced mid-September, Background). <strong style=\"font-weight:600\">Direction:</strong> Cohere is positioning the combined entity as a sovereign, enterprise-focused “Canadian-European AI champion” rather than competing directly on frontier capability — a different talent profile from frontier-lab research roles.</p>\n    </div>\n  </div>\n</section>\n\n<!-- 05 -->\n<section id=\"s05\" data-screen-label=\"05 Research radar\" style=\"padding-top:88px;scroll-margin-top:48px;display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;align-items:flex-end;gap:20px;padding-bottom:16px;border-bottom:2px solid var(--color-text)\">\n    <span style=\"font-family:var(--font-heading);font-weight:600;font-size:64px;line-height:.85;color:var(--color-accent)\">05</span>\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <span style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent-700)\">Section</span>\n      <h2 style=\"margin:0;font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.01em\">Research Radar</h2>\n    </div>\n  </div>\n  <p style=\"margin:0;font-size:14px;line-height:1.6;max-width:86ch;color:var(--color-neutral-700)\">Nine of this week's most interesting ML papers, selected for novelty and for how directly they bear on trading.</p>\n\n  <div style=\"display:flex;flex-direction:column\">\n    <article id=\"r1\" style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 16px;padding:28px 0;border-top:1px solid var(--color-divider);scroll-margin-top:56px\">\n      <span style=\"font-family:var(--font-heading);font-size:34px;line-height:1;color:var(--color-accent)\">1</span>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <h3 style=\"margin:0;font-size:24px;line-height:1.15\">From Search to Research: scaling autonomous quant factor-mining agents</h3>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">arXiv 2609.35559, StepFun / Shanghai Jiao Tong / UCLA / FinStep, 28 Sep</span></div>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.65;max-width:72ch;text-wrap:pretty\">This paper asks whether giving an AI agent more iterations to work actually improves real quantitative research, not just math or coding benchmarks. The team built 50 factor-mining tasks grounded in real Chinese A-share research reports and ran nine frontier models through up to ten rounds of hypothesis, code, backtest and refinement. Three findings stand out: deeper search narrows the gap between strong and weak models; the accumulated research state (code, backtest evidence, notes) matters more than which model continues the work — handing a strong model's half-finished investigation to a weaker model beats the reverse; and running several parallel short investigations beats one long one at equal compute. This is close to a blueprint for building an “AI research analyst” for quant factor discovery.</p>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;max-width:72ch;padding-left:14px;border-left:2px solid var(--color-accent)\"><strong style=\"font-weight:600\">Why a trading firm cares:</strong> directly — this is frontier models being benchmarked as autonomous quant researchers on real backtests, by a team that includes an industry quant shop.</p>\n      </div>\n    </article>\n    <article style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 16px;padding:28px 0;border-top:1px solid var(--color-divider)\">\n      <span style=\"font-family:var(--font-heading);font-size:34px;line-height:1;color:var(--color-accent)\">2</span>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <h3 style=\"margin:0;font-size:24px;line-height:1.15\">FERPO: a cleaner reinforcement-learning recipe that avoids mode collapse</h3>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">arXiv 2610.02198, 1 Oct</span></div>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.65;max-width:72ch;text-wrap:pretty\">Most modern continuous-control RL improves a policy by differentiating a learned value estimate (a “critic”) with respect to actions — but accurate value predictions don't guarantee accurate gradients, making updates noisy. FERPO instead derives an ideal target action distribution directly from the optimisation objective, without differentiating the critic, and fits the policy to that target using a statistical technique (forward KL divergence) that favours keeping several good strategies alive rather than collapsing early onto one.</p>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;max-width:72ch;padding-left:14px;border-left:2px solid var(--color-accent)\"><strong style=\"font-weight:600\">Why a trading firm cares, even if only moderately:</strong> the same collapse-onto-one-strategy failure mode shows up in RL-based execution and market-making policies that stop exploring once they find something that works; this is a transferable idea for keeping such systems adaptable.</p>\n      </div>\n    </article>\n    <article style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 16px;padding:28px 0;border-top:1px solid var(--color-divider)\">\n      <span style=\"font-family:var(--font-heading);font-size:34px;line-height:1;color:var(--color-accent)\">3</span>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <h3 style=\"margin:0;font-size:24px;line-height:1.15\">Why reasoning models' “thinking” drifts into gibberish — and why it's unavoidable</h3>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">arXiv 2610.02015, 1 Oct</span></div>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.65;max-width:72ch;text-wrap:pretty\">Reasoning models trained with reinforcement learning on verifiable rewards (RLVR) increasingly produce chains of thought full of garbled, non-standard phrasing, even when the final answer is correct. This paper proves why: RLVR only rewards the final answer, never the intermediate text, so nothing constrains the reasoning trace's surface form — unlike supervised fine-tuning, where every token is graded against human-like text. The authors show drift appears specifically when a model is pushed to solve genuinely novel problems, and prove a hard trade-off: you cannot make chains of thought more readable without also constraining how much reward the model can earn.</p>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;max-width:72ch;padding-left:14px;border-left:2px solid var(--color-accent)\"><strong style=\"font-weight:600\">Why a trading firm cares:</strong> if you plan to use chain-of-thought monitoring as an oversight layer on an autonomous research or trading agent, this paper says that oversight channel degrades exactly where you'd want it most — on the hardest, most novel problems.</p>\n      </div>\n    </article>\n    <article style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 16px;padding:28px 0;border-top:1px solid var(--color-divider)\">\n      <span style=\"font-family:var(--font-heading);font-size:34px;line-height:1;color:var(--color-accent)\">4</span>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <h3 style=\"margin:0;font-size:24px;line-height:1.15\">A cheaper way to get RL's generalisation benefits from ordinary supervised data</h3>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">arXiv 2610.02140, Harvard et al., 1 Oct</span></div>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.65;max-width:72ch;text-wrap:pretty\">Supervised fine-tuning (SFT) can use high-quality expert demonstrations a model could never have produced on its own, but tends to generalise poorly and cause forgetting. On-policy RL generalises well because it only reinforces a model's own outputs, but is stuck with whatever the model can already stumble into. This paper reshapes expert demonstrations — via a sampling procedure that progressively walks them toward what the model's current policy could plausibly produce — before training on them, letting SFT inherit RL's generalisation property while still learning from privileged expert data.</p>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;max-width:72ch;padding-left:14px;border-left:2px solid var(--color-accent)\"><strong style=\"font-weight:600\">Why a trading firm cares:</strong> directly useful for fine-tuning on proprietary research notes or trade rationales, where there's no automatically verifiable reward signal to build an RL pipeline around.</p>\n      </div>\n    </article>\n    <article style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 16px;padding:28px 0;border-top:1px solid var(--color-divider)\">\n      <span style=\"font-family:var(--font-heading);font-size:34px;line-height:1;color:var(--color-accent)\">5</span>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <h3 style=\"margin:0;font-size:24px;line-height:1.15\">A nearly free lunch for “looped” transformer architectures</h3>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">arXiv 2610.02185, 1 Oct</span></div>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.65;max-width:72ch;text-wrap:pretty\">Looped transformers save parameters by running one shared block of weights through several recurrent passes instead of stacking unique layers. Standard decoding throws away every pass except the last. This technique treats an earlier, “less cooked” pass as a free stand-in for a weaker model, and contrasts it against the final pass to amplify exactly the signal the extra computation added — with no extra training and, in one variant, almost no extra inference cost. Reported gains are large enough that some models can run with half as many loops and still beat a full-depth baseline, cutting inference cost by roughly a quarter to a half.</p>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;max-width:72ch;padding-left:14px;border-left:2px solid var(--color-accent)\"><strong style=\"font-weight:600\">Why a trading firm cares:</strong> any firm running latency-sensitive LLM inference should care about a free technique that cuts inference cost substantially at matched or better quality.</p>\n      </div>\n    </article>\n    <article style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 16px;padding:28px 0;border-top:1px solid var(--color-divider)\">\n      <span style=\"font-family:var(--font-heading);font-size:34px;line-height:1;color:var(--color-accent)\">6</span>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <h3 style=\"margin:0;font-size:24px;line-height:1.15\">Provably efficient algorithms for decision-making under worst-case uncertainty</h3>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">arXiv 2610.02131, Stanford, 1 Oct</span></div>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.65;max-width:72ch;text-wrap:pretty\">A “robust Markov Decision Process” is the standard framework for sequential decision-making when you don't fully trust your model of the world — you want a policy that performs well even under the worst case within some uncertainty range. This paper proves a much wider class of these problems, including the increasingly popular “Wasserstein-ball” uncertainty sets used in robust finance, can be solved by a single linear program in provably efficient time.</p>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;max-width:72ch;padding-left:14px;border-left:2px solid var(--color-accent)\"><strong style=\"font-weight:600\">Why a trading firm cares:</strong> this is close to the mathematical backbone of distributionally-robust portfolio optimisation and robust execution policies — a quant researcher with an optimisation background would find this immediately useful, and it's a good example of decision-theory research with a very short path to trading-strategy relevance.</p>\n      </div>\n    </article>\n    <article style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 16px;padding:28px 0;border-top:1px solid var(--color-divider)\">\n      <span style=\"font-family:var(--font-heading);font-size:34px;line-height:1;color:var(--color-accent)\">7</span>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <h3 style=\"margin:0;font-size:24px;line-height:1.15\">SYNTH: the first fully open synthetic pretraining recipe</h3>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">arXiv 2609.37891, 29 Sep</span></div>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.65;max-width:72ch;text-wrap:pretty\">Standard LLM pretraining still relies on raw web-crawl text, which contains little explicit step-by-step reasoning, forcing labs to patch this later with closed, internal synthetic datasets whose effects on model behaviour are poorly understood outside the labs that built them. This project expands roughly 59,000 Wikipedia articles into a much richer synthetic corpus that blends what used to be three separate training stages into one, with every example traceable to a cited source. Models trained on it match or beat web-trained baselines of similar size using 10 to 140 times fewer training tokens.</p>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;max-width:72ch;padding-left:14px;border-left:2px solid var(--color-accent)\"><strong style=\"font-weight:600\">Why a trading firm cares:</strong> directly applicable to building a compact, fact-grounded model from a firm's own proprietary document corpus, needing far less raw data than conventional wisdom assumes.</p>\n      </div>\n    </article>\n    <article style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 16px;padding:28px 0;border-top:1px solid var(--color-divider)\">\n      <span style=\"font-family:var(--font-heading);font-size:34px;line-height:1;color:var(--color-accent)\">8</span>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <h3 style=\"margin:0;font-size:24px;line-height:1.15\">A unified architecture that models text and images without discretising either</h3>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">arXiv 2609.40362, 30 Sep</span></div>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.65;max-width:72ch;text-wrap:pretty\">Today's unified text-and-image models either quantise images into discrete tokens (losing information) or bolt a separate continuous diffusion process onto discrete text modelling (limiting how tightly the two interact). This architecture represents both as continuous vector sequences in a shared space and learns a single generative process over both via flow matching. At modest scale, it already rivals unified models trained on far more data.</p>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;max-width:72ch;padding-left:14px;border-left:2px solid var(--color-accent)\"><strong style=\"font-weight:600\">Why a trading firm cares:</strong> mainly as an architecture-trend datapoint; the closest practical link is multimodal signal extraction from satellite imagery or scanned documents, where a cleaner, more data-efficient unified architecture is generically useful.</p>\n      </div>\n    </article>\n    <article style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 16px;padding:28px 0;border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)\">\n      <span style=\"font-family:var(--font-heading);font-size:34px;line-height:1;color:var(--color-accent)\">9</span>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <h3 style=\"margin:0;font-size:24px;line-height:1.15\">SoftServe: making second-order optimisation actually work at deep-learning scale</h3>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">arXiv 2610.02182, 1 Oct</span></div>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.65;max-width:72ch;text-wrap:pretty\">Quasi-Newton optimisers use curvature information, not just gradients, and are highly effective in classical convex optimisation — but have historically failed in deep learning because neural network loss landscapes are non-convex, so naive curvature estimates can become invalid. This method derives curvature estimates from a variational objective that stays mathematically well-behaved even when true local curvature is negative, and uses an iterative, GPU-friendly matrix method rather than exact decomposition. It beats Adam, Muon and SOAP on several hard, poorly-conditioned training problems.</p>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;max-width:72ch;padding-left:14px;border-left:2px solid var(--color-accent)\"><strong style=\"font-weight:600\">Why a trading firm cares:</strong> moderately — ill-conditioned optimisation landscapes also show up when training on financial data spanning very different scales or market regimes.</p>\n      </div>\n    </article>\n  </div>\n</section>\n\n<!-- 06 -->\n<section id=\"s06\" data-screen-label=\"06 Quant trading and AI\" style=\"padding-top:88px;scroll-margin-top:48px;display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;align-items:flex-end;gap:20px;padding-bottom:16px;border-bottom:2px solid var(--color-text)\">\n    <span style=\"font-family:var(--font-heading);font-weight:600;font-size:64px;line-height:.85;color:var(--color-accent)\">06</span>\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <span style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent-700)\">Section</span>\n      <h2 style=\"margin:0;font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.01em\">Quant Trading &amp; AI</h2>\n    </div>\n  </div>\n  <p style=\"margin:0;font-size:14px;line-height:1.6;max-width:86ch;color:var(--color-neutral-700)\">Two of the major trading firms had genuine, confirmed AI/ML news this week; most of the rest of the industry stayed quiet in public.</p>\n\n  <div style=\"display:flex;flex-direction:column\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\"><h4 style=\"margin:0;font-size:22px;letter-spacing:.06em;text-transform:uppercase\">Jane Street</h4><span style=\"font-family:var(--font-heading);font-size:17px;color:var(--color-accent-700)\">confirmed research output</span></div>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">blog.janestreet.com, 30 Sep–2 Oct</span></div>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;max-width:76ch;text-wrap:pretty\"><strong style=\"font-weight:600\">What happened:</strong> Jane Street's engineering blog published a cluster of technical posts this week, including “Mitigating memorization in LLMs,” “Can you use autoregressive diffusion to generate market data?” and a piece on trading compute for memory via activation checkpointing, alongside its regular roundup of summer intern projects.</p>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;max-width:76ch;text-wrap:pretty\"><strong style=\"font-weight:600\">Why it matters:</strong> this is Jane Street's standard cadence of public technical output, not a single headline event — but the specific topics (LLM memorisation risk, using generative diffusion models to synthesise realistic market data for backtesting, and compute-efficiency tricks for training large models) show a firm actively researching exactly the techniques a modern ML-driven research desk needs.</p>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;max-width:76ch;text-wrap:pretty\"><strong style=\"font-weight:600\">What it signals about strategy:</strong> continued investment in generative modelling for synthetic data generation, a technique that reduces dependence on scarce historical market data for backtesting new strategies.</p>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;max-width:76ch;text-wrap:pretty\"><strong style=\"font-weight:600\">Talent signal:</strong> Jane Street continues to publish at a level that works as an employer brand in its own right — the posts are substantive, technical and worth reading in full.</p>\n    </div>\n    <div style=\"display:flex;flex-direction:column;gap:12px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\"><h4 style=\"margin:0;font-size:22px;letter-spacing:.06em;text-transform:uppercase\">Citadel / Citadel Securities</h4><span style=\"font-family:var(--font-heading);font-size:17px;color:var(--color-accent-700)\">the week's standout quant-AI story</span></div>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;max-width:76ch;text-wrap:pretty\">The full Citadel-recruits-from-DeepMind story is covered in depth in Sections 01, 03 and 07. Separately, Citadel Securities took a minority stake in Wolfe Research — its first outside investor — to add equity-research distribution and win trading flow; this is primarily a business-distribution deal rather than an AI/ML story, but touches the firm's broader research-capability build-out. No on-the-record reaction from either entity was found this week to the OpenAI safety crisis or the FTC's rogue-agent probe (Section 01, items 1–2), despite Citadel's deep current engagement with AI-lab talent. <strong style=\"font-weight:600\">What it signals about ML's future in trading:</strong> a top-five multi-strategy fund treating frontier AI labs as a primary talent market, not a secondary one, is a leading indicator the rest of the industry will likely follow.</p>\n    </div>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;padding:24px;margin-top:8px;border:1px dashed var(--color-neutral-500)\">\n      <h4 style=\"margin:0;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-800)\">Also on the radar</h4>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:var(--color-neutral-700)\">Not this week’s news, but useful context for where the rest of the industry is heading.</p>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:0 32px\">\n        <p style=\"margin:0;padding:12px 0;border-top:1px solid var(--color-divider);font-size:14px;line-height:1.55\"><strong style=\"font-weight:600\">Two Sigma</strong> — a reported firm-wide mandate (24 September) requiring every employee, including compliance and PM staff, to integrate frontier AI models into daily workflows, supported by an embedded “AI Solutions” engineering team.</p>\n        <p style=\"margin:0;padding:12px 0;border-top:1px solid var(--color-divider);font-size:14px;line-height:1.55\"><strong style=\"font-weight:600\">XTX Markets</strong> — winding down its AIMO Prize for AI mathematical-olympiad progress (16 September), citing how quickly frontier models have progressed on hard problems.</p>\n        <p style=\"margin:0;padding:12px 0;border-top:1px solid var(--color-divider);font-size:14px;line-height:1.55\"><strong style=\"font-weight:600\">Hudson River Trading</strong> — continuing its HAIL “foundation models for markets” research effort, following an August CoreWeave/NVIDIA Vera Rubin compute deal.</p>\n        <p style=\"margin:0;padding:12px 0;border-top:1px solid var(--color-divider);font-size:14px;line-height:1.55\"><strong style=\"font-weight:600\">Jump Trading</strong> — a September ICML Expo presentation on multi-agent system design for quantitative finance.</p>\n      </div>\n      <p style=\"margin:4px 0 0;font-size:14.5px;line-height:1.6;max-width:86ch\"><strong style=\"font-weight:600\">The pattern:</strong> most quant shops continue to build AI/ML capability quietly, through hiring and internal tooling rather than announcements, while a smaller number — Citadel chief among them this week — are starting to compete for talent in the open, the way a frontier lab would.</p>\n    </div>\n  </div>\n</section>\n\n<!-- 07 -->\n<section id=\"s07\" data-screen-label=\"07 Big Tech vs quant trading\" style=\"padding-top:88px;scroll-margin-top:48px;display:flex;flex-direction:column;gap:28px\">\n  <div style=\"display:flex;align-items:flex-end;gap:20px;padding-bottom:16px;border-bottom:2px solid var(--color-text)\">\n    <span style=\"font-family:var(--font-heading);font-weight:600;font-size:64px;line-height:.85;color:var(--color-accent)\">07</span>\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <span style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent-700)\">Section</span>\n      <h2 style=\"margin:0;font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.01em\">Big Tech vs Quant Trading for ML Talent</h2>\n    </div>\n  </div>\n\n  <div style=\"display:flex;flex-direction:column\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <h4 style=\"flex:1 1 220px;margin:0;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent-700)\">Who's hiring, who's losing talent</h4>\n      <p style=\"flex:3 1 420px;margin:0;font-size:15.5px;line-height:1.7;max-width:72ch;text-wrap:pretty\">This week sharpened a trend rather than starting one. Citadel's explicit, named push into Google DeepMind (<a href=\"#i4\">Section 01, item 4</a>) is the clearest instance yet of a quant fund treating a frontier AI lab as a primary sourcing pool rather than a curiosity. On the other side of the ledger, OpenAI lost its longest-serving safety researcher to resignation and three more to termination in the same week (<a href=\"#s03\">Section 03</a>) — not a recruiting loss to a competitor, but a visible crack in retention at exactly the kind of senior, mission-driven researcher OpenAI most needs to keep. Meta's research organisation, per a background industry analysis still worth citing, has been running close to flat net headcount in research roles (778 hires against 785 departures over twelve months, roughly 19% attrition — the highest of the major labs) while carrying more open research postings than OpenAI, Anthropic and DeepMind combined. A large, continuously churning researcher population at one of the four frontier labs is, in practice, a standing talent pool for the rest of the market.</p>\n    </div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <h4 style=\"flex:1 1 220px;margin:0;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent-700)\">Which skills are gaining value</h4>\n      <p style=\"flex:3 1 420px;margin:0;font-size:15.5px;line-height:1.7;max-width:72ch;text-wrap:pretty\">The clearest cross-industry signal this week is that agentic AI infrastructure and reinforcement-learning post-training skills are now sought by frontier labs and quant firms using nearly identical language: NVIDIA, Meta Superintelligence Labs, xAI, Jump Trading and Hudson River Trading all posted roles this week built around distributed RL, agent evaluation harnesses and long-horizon tool-use planning (<a href=\"#s08\">Section 08</a> has the specifics). The job titles differ; the required skills are close to interchangeable, meaning a candidate with this profile can realistically move between a frontier lab and a top prop shop without retraining. Separately, the OpenAI safety crisis and the new FTC probe have created an immediate, narrow demand spike for AI-safety and red-teaming researchers with agent-control and auditor-liaison experience — exactly the profile of the three OpenAI researchers now on the market (<a href=\"#s03\">Section 03</a>).</p>\n    </div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <h4 style=\"flex:1 1 220px;margin:0;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent-700)\">What trading firms offer that tech can't, and vice versa</h4>\n      <div style=\"flex:3 1 420px;display:flex;flex-direction:column;gap:16px\">\n        <p style=\"margin:0;font-size:15.5px;line-height:1.7;max-width:72ch;text-wrap:pretty\">Quant firms are increasingly explicit about two advantages over frontier labs: materially fewer working hours (Jane Street and Two Sigma both lean on this directly in recruiting conversations) and a tighter, more legible link between a researcher's work and an economic outcome — a strategy either makes money or it doesn't, compared with the more diffuse, longer-horizon bet of frontier AI research. Frontier labs, for their part, still offer a scale of compute and a mission narrative (building transformative AI, not just extracting alpha from it) that is hard for even the largest quant fund to match, along with headline compensation that, at the very top of the market, now exceeds typical quant pay — OpenAI and xAI's median reported engineering total compensation (roughly $635,000 and $665,000 respectively) sits above the broad quant-industry median, though the gap narrows sharply once you compare senior quant-research compensation specifically rather than broad engineering medians.</p>\n      </div>\n    </div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <h4 style=\"flex:1 1 220px;margin:0;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent-700)\">A hiring complication: title inflation</h4>\n      <div style=\"flex:3 1 420px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,max-content));gap:16px 48px\">\n          <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-family:var(--font-heading);font-weight:600;font-size:44px;line-height:1;color:var(--color-accent-700)\">~56%</span><span style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700)\">OpenAI · “Member of Technical Staff”</span></div>\n          <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-family:var(--font-heading);font-weight:600;font-size:44px;line-height:1;color:var(--color-accent-700)\">~71%</span><span style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700)\">Anthropic · “Member of Technical Staff”</span></div>\n        </div>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.7;max-width:72ch;text-wrap:pretty\">A majority of the people doing research-scientist-level work at OpenAI and Anthropic now carry the title “Member of Technical Staff” rather than “Research Scientist” — reportedly around 56% at OpenAI and 71% at Anthropic, per a background industry analysis. Google DeepMind is the holdout, still running a traditional levelled research ladder. Anyone searching for “Research Scientist” alone will therefore miss most of the actual research population at two of the four major labs; searches need to be built around skills and lab affiliation, not title.</p>\n      </div>\n    </div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 0;border-top:1px solid var(--color-divider)\">\n      <h4 style=\"flex:1 1 220px;margin:0;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent-700)\">What this week shifts in the balance</h4>\n      <p style=\"flex:3 1 420px;margin:0;font-size:15.5px;line-height:1.7;max-width:72ch;text-wrap:pretty\">The OpenAI safety crisis is, on balance, a point in favour of quant trading firms in this competition: a researcher who has just watched colleagues fired and a respected peer resign over cultural concerns is likely to be more open to what trading firms offer — stability, clearer incentive alignment and shorter hours — than they were a month ago. Citadel’s explicit DeepMind push this week suggests at least one major fund has already drawn that conclusion and is acting on it.</p>\n    </div>\n  </div>\n\n  <div style=\"display:flex;flex-direction:column;gap:10px;padding:24px 28px;background:var(--color-accent-900);color:var(--color-bg)\">\n    <span style=\"font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-300)\">The balance of power</span>\n    <p style=\"margin:0;font-family:var(--font-heading);font-size:24px;line-height:1.3;max-width:62ch;text-wrap:pretty\">A frontier-lab researcher watching colleagues fired and a respected peer resign this week may, for the first time in a while, find a quant firm’s case more compelling than a competing lab’s counter-offer.</p>\n  </div>\n\n  <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:8px\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\"><h4 style=\"margin:0;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-700)\">Skills in strongest demand this week</h4></div>\n    <div style=\"display:flex;flex-direction:column\">\n      <div style=\"display:grid;grid-template-columns:minmax(160px,300px) minmax(0,1fr);gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--color-divider)\"><span style=\"font-family:var(--font-heading);font-weight:600;font-size:21px\">Agentic AI infra &amp; RL post-training</span><span style=\"font-size:15px;color:var(--color-neutral-800)\">NVIDIA, Meta MSL, xAI, Jump, HRT all posted near-identical roles this week</span></div>\n      <div style=\"display:grid;grid-template-columns:minmax(160px,300px) minmax(0,1fr);gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--color-divider)\"><span style=\"font-family:var(--font-heading);font-weight:600;font-size:21px\">AI safety / governance / red-teaming</span><span style=\"font-size:15px;color:var(--color-neutral-800)\">FTC probe, White House accord, OpenAI safety exodus all landed this week</span></div>\n      <div style=\"display:grid;grid-template-columns:minmax(160px,300px) minmax(0,1fr);gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--color-divider)\"><span style=\"font-family:var(--font-heading);font-weight:600;font-size:21px\">LLM-driven research automation</span><span style=\"font-size:15px;color:var(--color-neutral-800)\">StepFun/SJTU factor-mining paper; Meta's AI-assisted math-research push</span></div>\n      <div style=\"display:grid;grid-template-columns:minmax(160px,300px) minmax(0,1fr);gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--color-divider)\"><span style=\"font-family:var(--font-heading);font-weight:600;font-size:21px\">Decision-model / agent-routing engineering</span><span style=\"font-size:15px;color:var(--color-neutral-800)\">Strands Decider 2B, OpenAI Decisions API both launched this week</span></div>\n      <div style=\"display:grid;grid-template-columns:minmax(160px,300px) minmax(0,1fr);gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)\"><span style=\"font-family:var(--font-heading);font-weight:600;font-size:21px\">Mechanistic interpretability</span><span style=\"font-size:15px;color:var(--color-neutral-800)\">Sustained hiring at Anthropic; renewed coverage of Jacobian Lens research</span></div>\n    </div>\n    <p style=\"margin:0;font-size:13px;color:var(--color-neutral-700)\">Judgment call based on this week's evidence density, not a market survey — treat as directional.</p>\n  </div>\n</section>\n\n<!-- 08 -->\n<section id=\"s08\" data-screen-label=\"08 Jobs and hiring market\" style=\"padding-top:88px;scroll-margin-top:48px;display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;align-items:flex-end;gap:20px;padding-bottom:16px;border-bottom:2px solid var(--color-text)\">\n    <span style=\"font-family:var(--font-heading);font-weight:600;font-size:64px;line-height:.85;color:var(--color-accent)\">08</span>\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <span style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent-700)\">Section</span>\n      <h2 style=\"margin:0;font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.01em\">Jobs &amp; Hiring Market</h2>\n    </div>\n  </div>\n  <p style=\"margin:0;font-size:14px;line-height:1.6;max-width:90ch;color:var(--color-neutral-700)\">Twelve representative postings from this week, spanning both tech and trading firms, selected for what they reveal about where hiring pressure is concentrated rather than as an exhaustive listing.</p>\n\n  <div style=\"overflow-x:auto\">\n    <table class=\"table\" style=\"min-width:1040px;font-size:13.5px;line-height:1.5\">\n      <thead>\n        <tr><th style=\"width:10%\">Company</th><th style=\"width:14%\">Role</th><th style=\"width:10%\">Location</th><th style=\"width:11%\">Seniority</th><th style=\"width:17%\">Technical focus</th><th style=\"width:20%\">Why it’s interesting</th><th style=\"width:18%\">Who it suits</th></tr>\n      </thead>\n      <tbody>\n        <tr style=\"vertical-align:top\"><td style=\"font-family:var(--font-heading);font-weight:600;font-size:16px;padding:14px 8px\">Citadel</td><td style=\"font-weight:500;padding:14px 8px\">Systematic Equities Researcher (new team)</td><td style=\"padding:14px 8px\">Chicago / New York</td><td style=\"padding:14px 8px\">Senior / Lead</td><td style=\"padding:14px 8px\">Idea generation + directing AI research systems (“managers of machines”)</td><td style=\"padding:14px 8px\">Newly formed team under a recent TGS Management hire, inside Citadel's explicit AI-lab recruiting push</td><td style=\"padding:14px 8px;color:var(--color-neutral-800)\">DeepMind / OpenAI / Anthropic researcher with applied RL or forecasting background</td></tr>\n        <tr style=\"vertical-align:top\"><td style=\"font-family:var(--font-heading);font-weight:600;font-size:16px;padding:14px 8px\">Jane Street</td><td style=\"font-weight:500;padding:14px 8px\">Machine Learning Researcher</td><td style=\"padding:14px 8px\">New York (also London, Hong Kong)</td><td style=\"padding:14px 8px\">Broad: intern to senior</td><td style=\"padding:14px 8px\">Deep learning for trading — LLMs, RL agents, recommendation systems, classical ML</td><td style=\"padding:14px 8px\">No fixed skill template; explicitly welcomes LLM/RL backgrounds, not only classic quant-stats profiles</td><td style=\"padding:14px 8px;color:var(--color-neutral-800)\">ML researcher/engineer from any domain with strong empirical and engineering chops</td></tr>\n        <tr style=\"vertical-align:top\"><td style=\"font-family:var(--font-heading);font-weight:600;font-size:16px;padding:14px 8px\">Two Sigma</td><td style=\"font-weight:500;padding:14px 8px\">Quantitative Software Engineer, Generative AI</td><td style=\"padding:14px 8px\">New York</td><td style=\"padding:14px 8px\">Principal (12–15+ yrs)</td><td style=\"padding:14px 8px\">Leading applied GenAI research initiatives; scalable production NLP/ML systems</td><td style=\"padding:14px 8px\">A Principal-level GenAI leadership seat inside a quant fund, not just a research role</td><td style=\"padding:14px 8px;color:var(--color-neutral-800)\">Senior NLP/LLM engineer-researcher hybrid from OpenAI, Anthropic or Google with shipping experience</td></tr>\n        <tr style=\"vertical-align:top\"><td style=\"font-family:var(--font-heading);font-weight:600;font-size:16px;padding:14px 8px\">Hudson River Trading</td><td style=\"font-weight:500;padding:14px 8px\">Software Engineer, Applied AI</td><td style=\"padding:14px 8px\">London / New York / Singapore</td><td style=\"padding:14px 8px\">Mid–senior ($200k–$300k base)</td><td style=\"padding:14px 8px\">AI infrastructure, RLHF/post-training, agent evaluation, alignment for an internal agentic stack</td><td style=\"padding:14px 8px\">HRT is building its own internal “Applied AI” stack mirroring a frontier lab's structure, not just buying vendor tools</td><td style=\"padding:14px 8px;color:var(--color-neutral-800)\">Research engineer from a frontier lab's post-training, RLHF or agent-eval team</td></tr>\n        <tr style=\"vertical-align:top\"><td style=\"font-family:var(--font-heading);font-weight:600;font-size:16px;padding:14px 8px\">Jump Trading</td><td style=\"font-weight:500;padding:14px 8px\">AI Research Scientist, R&amp;D</td><td style=\"padding:14px 8px\">New York / London / Singapore</td><td style=\"padding:14px 8px\">Senior (5+ yrs, PhD preferred, $200k–$300k base)</td><td style=\"padding:14px 8px\">LLM research applied to quant signals from unstructured data; agentic systems; transformers/SSMs</td><td style=\"padding:14px 8px\">Mission language (“put frontier AI capabilities into the hands of the people doing the most demanding quantitative work”) reads like a lab's own pitch</td><td style=\"padding:14px 8px;color:var(--color-neutral-800)\">Published LLM/transformer researcher (NeurIPS/ICML/ICLR) trading publication for deployment speed</td></tr>\n        <tr style=\"vertical-align:top\"><td style=\"font-family:var(--font-heading);font-weight:600;font-size:16px;padding:14px 8px\">Susquehanna / SIG</td><td style=\"font-weight:500;padding:14px 8px\">Senior Machine Learning Researcher</td><td style=\"padding:14px 8px\">Bala Cynwyd, PA / New York</td><td style=\"padding:14px 8px\">Senior (5+ yrs, PhD, ~$300k base)</td><td style=\"padding:14px 8px\">Deep learning for time-series forecasting and NLP applied to trading signals</td><td style=\"padding:14px 8px\">Framed as an active expansion of the ML group, not steady-state backfill</td><td style=\"padding:14px 8px;color:var(--color-neutral-800)\">Deep learning PhD with a strong publication record moving into applied forecasting</td></tr>\n        <tr style=\"vertical-align:top\"><td style=\"font-family:var(--font-heading);font-weight:600;font-size:16px;padding:14px 8px\">DRW</td><td style=\"font-weight:500;padding:14px 8px\">Quantitative Researcher, Futures</td><td style=\"padding:14px 8px\">Chicago (also London)</td><td style=\"padding:14px 8px\">3–5 years</td><td style=\"padding:14px 8px\">Non-linear ML signal modelling, regime-aware frameworks, alternative-data integration</td><td style=\"padding:14px 8px\">A concrete mandate to move signal construction beyond classic linear/mean-variance models</td><td style=\"padding:14px 8px;color:var(--color-neutral-800)\">Applied ML researcher with time-series or regime-switching experience; no frontier-lab pedigree required</td></tr>\n        <tr style=\"vertical-align:top\"><td style=\"font-family:var(--font-heading);font-weight:600;font-size:16px;padding:14px 8px\">NVIDIA</td><td style=\"font-weight:500;padding:14px 8px\">Senior Deep Learning Scientist, Multimodal Agentic RL</td><td style=\"padding:14px 8px\">Santa Clara, CA</td><td style=\"padding:14px 8px\">Senior (8+ yrs, MSc/PhD)</td><td style=\"padding:14px 8px\">RLHF/RLVR post-training for multimodal agentic reasoning (Nemotron platform)</td><td style=\"padding:14px 8px\">Posted with an unusually tight application window — signals urgent, product-tied headcount need</td><td style=\"padding:14px 8px;color:var(--color-neutral-800)\">RL/post-training specialist with multimodal foundation-model experience and top-tier publications</td></tr>\n        <tr style=\"vertical-align:top\"><td style=\"font-family:var(--font-heading);font-weight:600;font-size:16px;padding:14px 8px\">NVIDIA</td><td style=\"font-weight:500;padding:14px 8px\">Senior Staff Software Engineer, Agentic AI Applications</td><td style=\"padding:14px 8px\">Enterprise AI (US)</td><td style=\"padding:14px 8px\">Staff/Principal (12+ yrs)</td><td style=\"padding:14px 8px\">Hardening production agent infrastructure: orchestration, memory/context services, eval frameworks, governance</td><td style=\"padding:14px 8px\">Explicitly an infrastructure/engineering leadership seat, not a research role — a distinct, maturing job category</td><td style=\"padding:14px 8px;color:var(--color-neutral-800)\">Platform/infra engineer rather than a pure ML researcher</td></tr>\n        <tr style=\"vertical-align:top\"><td style=\"font-family:var(--font-heading);font-weight:600;font-size:16px;padding:14px 8px\">Meta Superintelligence Labs</td><td style=\"font-weight:500;padding:14px 8px\">Research Scientist, FAIR RAM (Reasoning, Alignment, Memory)</td><td style=\"padding:14px 8px\">Menlo Park, CA</td><td style=\"padding:14px 8px\">Research Scientist (2+ yrs industry GenAI/LLM)</td><td style=\"padding:14px 8px\">Long-horizon RL and agents; self-alignment and scalable alignment methods</td><td style=\"padding:14px 8px\">Paired this week with a new Privacy Evals team mirroring the governance functions now under FTC scrutiny industry-wide</td><td style=\"padding:14px 8px;color:var(--color-neutral-800)\">Researcher from Meta's own high-attrition research population, or an adjacent lab</td></tr>\n        <tr style=\"vertical-align:top\"><td style=\"font-family:var(--font-heading);font-weight:600;font-size:16px;padding:14px 8px\">xAI</td><td style=\"font-weight:500;padding:14px 8px\">Member of Technical Staff, Reasoning</td><td style=\"padding:14px 8px\">Palo Alto / Bay Area (in-office)</td><td style=\"padding:14px 8px\">3+ years</td><td style=\"padding:14px 8px\">Distributed RL systems; inference-time reasoning; RLHF/DPO post-training for Grok</td><td style=\"padding:14px 8px\">Unusually fast hiring process (CV plus a statement of exceptional work, four technical rounds in about a week); reportedly the industry's highest median engineering compensation</td><td style=\"padding:14px 8px;color:var(--color-neutral-800)\">RL systems engineer comfortable with a high-intensity, low-bureaucracy culture</td></tr>\n        <tr style=\"vertical-align:top\"><td style=\"font-family:var(--font-heading);font-weight:600;font-size:16px;padding:14px 8px\">Anthropic</td><td style=\"font-weight:500;padding:14px 8px\">Research Scientist, Interpretability</td><td style=\"padding:14px 8px\">London (SF remains primary hub)</td><td style=\"padding:14px 8px\">Research Science, broad band (£260k–£370k)</td><td style=\"padding:14px 8px\">AI Control and alignment stress-testing — building “model organisms of misalignment”</td><td style=\"padding:14px 8px\">An opportunistic London satellite growing while SF stays the clear priority, amid the week's FTC scrutiny</td><td style=\"padding:14px 8px;color:var(--color-neutral-800)\">PhD or strong research track record in adversarial ML/safety, Python-fluent</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px;margin-top:8px\">\n    <h4 style=\"margin:0;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-700)\">Cross-company patterns worth naming</h4>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:24px\">\n      <div class=\"blueprint\" style=\"display:flex;flex-direction:column;gap:10px;padding:22px\">\n        <i class=\"corner tl\"></i><i class=\"corner tr\"></i><i class=\"corner bl\"></i><i class=\"corner br\"></i>\n        <p style=\"margin:0;font-size:15px;line-height:1.65;text-wrap:pretty\"><strong style=\"font-weight:600\">Rising demand for RL and reasoning experience is now genuinely cross-industry.</strong> NVIDIA, Meta, xAI, Jump Trading and Hudson River Trading all posted roles this week built around near-identical technical cores — distributed reinforcement learning, agent evaluation harnesses, long-horizon tool-use planning — under different job titles. A candidate with this profile can move between a frontier lab and a top prop shop without retraining — one of the most portable profiles in the market right now.</p>\n      </div>\n      <div class=\"blueprint\" style=\"display:flex;flex-direction:column;gap:10px;padding:22px\">\n        <i class=\"corner tl\"></i><i class=\"corner tr\"></i><i class=\"corner bl\"></i><i class=\"corner br\"></i>\n        <p style=\"margin:0;font-size:15px;line-height:1.65;text-wrap:pretty\"><strong style=\"font-weight:600\">“Agent infrastructure engineer” is becoming a distinct, senior title in its own right</strong> — NVIDIA's Staff posting above is explicitly not a research role, and Hudson River Trading's Applied AI posting reads the same way. This is a title to start tracking separately from “ML researcher” or “research scientist.”</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!-- 09 -->\n<section id=\"s09\" data-screen-label=\"09 Academia to industry\" style=\"padding-top:88px;scroll-margin-top:48px;display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;align-items:flex-end;gap:20px;padding-bottom:16px;border-bottom:2px solid var(--color-text)\">\n    <span style=\"font-family:var(--font-heading);font-weight:600;font-size:64px;line-height:.85;color:var(--color-accent)\">09</span>\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <span style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent-700)\">Section</span>\n      <h2 style=\"margin:0;font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.01em\">Academia → Industry</h2>\n    </div>\n  </div>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:0 48px\">\n    <div style=\"display:flex;flex-direction:column;gap:10px;padding:22px 0;border-top:1px solid var(--color-divider)\">\n      <h3 style=\"margin:0;font-size:21px;line-height:1.2\">Elad Hazan's Princeton lab pivots toward alignment</h3>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">Hazan's own public statement; no specific date confirmed within window</span></div>\n      <p style=\"margin:0;font-size:15px;line-height:1.65;text-wrap:pretty\">Elad Hazan, the Princeton computer science professor who runs a Google DeepMind-affiliated lab on campus, has said he is now focusing most of his energy on AI alignment and is opening new postdoctoral positions tied to a new Princeton research centre. A frontier-lab-affiliated academic lab sitting inside a top CS department, now reorienting toward exactly the specialism in acute demand this week (Section 01, items 1–3), is a strong pipeline signal worth active monitoring.</p>\n    </div>\n    <div style=\"display:flex;flex-direction:column;gap:10px;padding:22px 0;border-top:1px solid var(--color-divider)\">\n      <h3 style=\"margin:0;font-size:21px;line-height:1.2\">Stanford and CMU remain the deepest pipelines for stealth-founder and frontier-research talent</h3>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">frontrun.vc stealth-founder tracking, mid-September</span></div>\n      <p style=\"margin:0;font-size:15px;line-height:1.65;text-wrap:pretty\">A background dataset tracking 2,478 stealth-mode founders (people who have left a known employer to build something unannounced) found the deepest pools come from Meta, Google, Microsoft, Amazon, Apple, OpenAI and Google DeepMind, in that order — with Stanford and Carnegie Mellon PhD pipelines the most common academic through-line among them.</p>\n    </div>\n    <div style=\"display:flex;flex-direction:column;gap:10px;padding:22px 0;border-top:1px solid var(--color-divider)\">\n      <h3 style=\"margin:0;font-size:21px;line-height:1.2\">Direct academic-industry collaboration this week</h3>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">Section 01 item 9; Section 05 item 1 cross-reference</span></div>\n      <p style=\"margin:0;font-size:15px;line-height:1.65;text-wrap:pretty\">Meta's Context Language Models research (<a href=\"#s04\">Section 04</a>) was co-authored with the University of Washington, MIT and Trillium Labs — a live example of frontier-lab/university collaboration on exactly the long-horizon-agent research direction covered in <a href=\"#s02\">Section 02</a>. Separately, Stanford's Yinyu Ye co-authored this week's robust Markov Decision Process paper (Section 05, item 6), a piece of decision-theory research with an unusually short path to trading-strategy relevance — Stanford's operations-research and optimisation programme remains one of the strongest, if less visible, feeders into quant-adjacent research roles.</p>\n    </div>\n  </div>\n</section>\n\n<!-- 12 -->\n<section id=\"s10\" data-screen-label=\"10 Market and business context\" style=\"padding-top:88px;scroll-margin-top:48px;display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;align-items:flex-end;gap:20px;padding-bottom:16px;border-bottom:2px solid var(--color-text)\">\n    <span style=\"font-family:var(--font-heading);font-weight:600;font-size:64px;line-height:.85;color:var(--color-accent)\">10</span>\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <span style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent-700)\">Section</span>\n      <h2 style=\"margin:0;font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.01em\">Market &amp; Business Context</h2>\n    </div>\n  </div>\n  <p style=\"margin:0;font-size:14px;line-height:1.6;max-width:90ch;color:var(--color-neutral-700)\">Full detail on the FTC probe, the California AG subpoena and the White House accord is in Section 01 (<a href=\"#i2\">items 2–3</a>); this section covers the broader market and regulatory backdrop those stories sit inside. There was no Federal Reserve meeting this week — the next FOMC meeting is 27–28 October 2026 — so no AI-relevant rate datapoint to report.</p>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:0 48px\">\n    <div style=\"display:flex;flex-direction:column;gap:10px;padding:22px 0;border-top:1px solid var(--color-divider)\">\n      <h3 style=\"margin:0;font-size:21px;line-height:1.2\">A bipartisan Senate AI safety bill is gaining momentum</h3>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">Semafor, The Hill</span></div>\n      <p style=\"margin:0;font-size:15px;line-height:1.65;text-wrap:pretty\">A bipartisan Senate effort (reportedly involving Klobuchar, Cruz and Thune) addressing catastrophic risk (biological and nuclear) AI guardrails is in active drafting, with frontier labs and advocacy groups weighing in on draft text; OpenAI's head of policy Chris Lehane has publicly pushed Congress to act before adjournment. This continues the OpenAI-favours-federal-preemption versus Anthropic-favours-state-by-state-laws dynamic referenced in <a href=\"#i10\">Section 01, item 10</a> — both labs continue to endorse selected state AI bills as leverage toward a de facto national framework. No bill has actually been introduced yet within this window; treat as an active, unresolved thread rather than a dated event.</p>\n    </div>\n    <div style=\"display:flex;flex-direction:column;gap:10px;padding:22px 0;border-top:1px solid var(--color-divider)\">\n      <h3 style=\"margin:0;font-size:21px;line-height:1.2\">NVIDIA's export-control oversight comes under direct scrutiny</h3>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">DOJ arrest is a matter of public record; oversight-failure framing per Bloomberg investigation</span></div>\n      <p style=\"margin:0;font-size:15px;line-height:1.65;text-wrap:pretty\">A Bloomberg investigation detailed how NVIDIA's compliance mechanisms allegedly missed red flags — including surveillance showing labels stripped off servers — as restricted AI chips reached China. The same week, US authorities arrested an individual in California on smuggling and money-laundering charges tied to more than $300m in NVIDIA-chip-equipped servers routed to China between 2023 and 2024, adding to a March 2026 case tied to roughly $510m, bringing alleged diversions to over $800m. Senators from both parties had already pressed the Commerce Secretary on NVIDIA's export-licence monitoring before this week's reporting.</p>\n      <p style=\"margin:0;font-size:15px;line-height:1.65;text-wrap:pretty\"><strong style=\"font-weight:600\">Why it connects to AI/ML talent:</strong> Chip export-control enforcement risk bears directly on the compute supply chain that both frontier labs and quant firms depend on for training and research infrastructure; tighter controls would raise effective compute costs across the industry, with second-order effects on how aggressively labs can compete for researchers on infrastructure-heavy projects.</p>\n    </div>\n    <div style=\"display:flex;flex-direction:column;gap:10px;padding:22px 0;border-top:1px solid var(--color-divider)\">\n      <h3 style=\"margin:0;font-size:21px;line-height:1.2\">Anthropic's $518bn compute commitment is this week's clearest AI-infrastructure capex datapoint</h3>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">cross-referenced from Section 01, item 7</span></div>\n      <p style=\"margin:0;font-size:15px;line-height:1.65;text-wrap:pretty\">Beyond the IPO story itself (<a href=\"#i7\">Section 01</a>), the scale of Anthropic's forward compute commitment — roughly $518bn — is worth sitting with as a standalone macro fact: a single AI company has now committed, on paper, more to future compute infrastructure than most countries' annual government budgets. This is the clearest available evidence that compute capital intensity, not researcher headcount, is now the dominant cost driver in frontier AI, which has second-order implications for how labs structure compensation (more equity, less cash, to preserve capital for compute) and for how trading firms should think about AI-infrastructure exposure in portfolios tied to the sector.</p>\n    </div>\n    <div style=\"display:flex;flex-direction:column;gap:10px;padding:22px 0;border-top:1px solid var(--color-divider)\">\n      <h3 style=\"margin:0;font-size:21px;line-height:1.2\">Citadel's AI-lab recruiting push, read as a market-structure signal</h3>\n      <p style=\"margin:0;font-size:15px;line-height:1.65;text-wrap:pretty\">Beyond the talent story itself (<a href=\"#i4\">Section 01, item 4</a>; <a href=\"#s07\">Section 07</a>), Citadel's explicit push into AI-lab hiring is worth reading as a signal about where multi-strategy funds see their next source of edge: not new asset classes or new geographies, but better internal use of AI research talent to automate and scale the research process itself. If this proves out, expect other multi-strategy funds to follow with similarly public recruiting pushes over the next two quarters.</p>\n    </div>\n  </div>\n</section>\n\n<!-- 13 -->\n<!-- 14 -->\n<!-- CLOSING -->\n<!-- 11 -->\n<section id=\"s11\" data-screen-label=\"11 Starting out\" style=\"padding-top:88px;scroll-margin-top:48px;display:flex;flex-direction:column;gap:28px\">\n  <div
